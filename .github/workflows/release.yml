name: Release Snovac Compiler

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0, v1.0.1, latest)'
        required: true
        default: 'latest'
        type: string
      release_name:
        description: 'Release Title'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create as Draft Release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: darwin
            arch: x86_64
            runner: macos-13
          - os: darwin
            arch: aarch64
            runner: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile snovac binary
        run: |
          make clean
          make

      - name: Run Test Gates
        run: make test

      - name: Package release artifact
        run: |
          mkdir -p dist
          cp build/snovac dist/snovac
          tar -czf "snovac-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist snovac
          shasum -a 256 "snovac-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" > "snovac-${{ matrix.os }}-${{ matrix.arch }}.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snovac-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            snovac-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            snovac-${{ matrix.os }}-${{ matrix.arch }}.sha256
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release files
        run: |
          mkdir -p release-dist
          find release-assets -type f -exec cp {} release-dist/ \;
          ls -la release-dist

      - name: Determine Tag and Title
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            TITLE="${{ inputs.release_name }}"
            [ -z "$TITLE" ] && TITLE="Snovalang Compiler ${TAG}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="Snovalang Compiler ${TAG}"
          else
            TAG="latest"
            TITLE="Snovalang Compiler (Latest Release)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Publish or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
