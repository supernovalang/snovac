name: Release Snovac Compiler

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: darwin
            arch: x86_64
            runner: macos-13
          - os: darwin
            arch: aarch64
            runner: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile snovac binary
        run: |
          make clean
          make

      - name: Package release artifact
        run: |
          mkdir -p dist
          cp build/snovac dist/snovac
          tar -czf "snovac-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist snovac
          shasum -a 256 "snovac-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" > "snovac-${{ matrix.os }}-${{ matrix.arch }}.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snovac-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            snovac-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            snovac-${{ matrix.os }}-${{ matrix.arch }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release files
        run: |
          mkdir -p release-dist
          find release-assets -type f -exec cp {} release-dist/ \;
          ls -la release-dist

      - name: Publish or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Snovalang Compiler (Latest Release)' }}
          draft: false
          prerelease: false
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
